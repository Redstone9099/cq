name: R6.7 Windows build and regression
on:
  push:
    branches: [fix/r67-rewards-hotbar-20261024]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Fetch exact R6.6 baseline
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/Redstone9099/cq/releases/download/v1/Mir2_R6_6_Skills_Hotbar_Fixed_20261024.zip' -OutFile base.zip
          if ((Get-FileHash base.zip -Algorithm SHA256).Hash -ne '56218c7e1fefc299eff6b2dc8a1e84abdf168d812442820056625790a1fbf758') { throw 'Baseline ZIP mismatch' }
          Expand-Archive base.zip -DestinationPath package
      - name: Reproduce original compiler and attribution failures
        shell: pwsh
        run: ./r67/Verification/Reproduce-R65.ps1 -BaseRoot ./package/Mir2_R6_6
      - name: Apply the reviewed R6.7 changes
        shell: pwsh
        run: Copy-Item ./r67/* ./package/Mir2_R6_6 -Recurse -Force
      - name: Client full build and all regression gates
        shell: pwsh
        run: ./package/Mir2_R6_6/Build-R6.ps1 -BuildOnly
      - name: Server full build and reward gate
        shell: pwsh
        run: ./package/Mir2_R6_6/Build-Server-R6.7.ps1
      - name: Regression output isolation
        shell: pwsh
        run: ./package/Mir2_R6_6/Verification/Test-RegressionBuildIsolation.ps1
      - name: Archive logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r67-windows-build-logs
          path: package/Mir2_R6_6/build-logs/
          retention-days: 30
