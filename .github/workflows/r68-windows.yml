name: R6.8 ground loot Windows verification
on:
  push:
    branches: [fix/r68-ground-loot-20261024]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Fetch R6.7 baseline and apply R6.8
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/Redstone9099/cq/releases/download/v1/Mir2_R6_7_Rewards_Hotbar_Fixed_20261024.zip' -OutFile base.zip
          if ((Get-FileHash base.zip -Algorithm SHA256).Hash -ne '0ea4f3e860ad425eeace3bdd8dab76ab9e5533a499cdf11aab44b16fe6b332cb') { throw 'Baseline ZIP mismatch' }
          Expand-Archive base.zip -DestinationPath package
          Copy-Item ./r68/* ./package/Mir2_R6_7 -Recurse -Force
      - name: Client full build and all regression gates
        shell: pwsh
        run: ./package/Mir2_R6_7/Build-R6.ps1 -BuildOnly
      - name: Server full build and reward gate
        shell: pwsh
        run: ./package/Mir2_R6_7/Build-Server-R6.8.ps1
      - name: Regression output isolation
        shell: pwsh
        run: ./package/Mir2_R6_7/Verification/Test-RegressionBuildIsolation.ps1
      - name: Archive logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r68-windows-build-logs
          path: package/Mir2_R6_7/build-logs/
          retention-days: 30
