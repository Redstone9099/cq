(async()=>{
const canvas=document.querySelector('#stage'),ctx=canvas.getContext('2d'),images={};
for(const [key,url] of Object.entries(config.images)){const im=new Image();im.src=url;await im.decode();images[key]=im}
const tile=document.createElement('canvas');tile.width=200;tile.height=145;const tc=tile.getContext('2d');
const mask=document.createElement('canvas');mask.width=200;mask.height=145;const mc=mask.getContext('2d');
const tint=document.createElement('canvas');tint.width=96;tint.height=32;const tt=tint.getContext('2d');
function sprites(context,calls){for(const [f,x,y,w,h,r,g,b,a,blend] of calls){const im=images[f];tt.clearRect(0,0,96,32);tt.globalCompositeOperation='source-over';tt.drawImage(im,0,0);tt.globalCompositeOperation='source-in';tt.fillStyle=`rgb(${r},${g},${b})`;tt.fillRect(0,0,96,32);context.globalCompositeOperation=blend?'lighter':'source-over';context.globalAlpha=a/255;context.drawImage(tint,0,0,im.width,im.height,x,y,w,h)}context.globalAlpha=1;context.globalCompositeOperation='source-over'}
function render(time){ctx.clearRect(0,0,1000,220);ctx.fillStyle='#151a1e';ctx.fillRect(0,0,1000,220);const t=Math.round(time/50)*50;for(let grade=1;grade<=5;grade++){const s=config.samples.find(s=>s.time===t&&s.grade===grade);tc.globalCompositeOperation='source-over';tc.fillStyle='#3d382e';tc.fillRect(0,0,200,145);sprites(tc,s.ground);const [x,y,w,h]=s.body;tc.fillStyle='#898575';tc.fillRect(x,y,w,h);tc.fillStyle='#ccc4a5';tc.fillRect(x,y,w,2);sprites(tc,s.highlights);if(document.querySelector('#light').value==='night'){mc.globalCompositeOperation='source-over';mc.fillStyle='#171717';mc.fillRect(0,0,200,145);sprites(mc,s.light);tc.globalCompositeOperation='multiply';tc.drawImage(mask,0,0);tc.globalCompositeOperation='source-over'}ctx.fillStyle=config.colours[grade-1];ctx.font='16px system-ui';ctx.fillText(config.names[grade-1],(grade-1)*200+20,28);ctx.drawImage(tile,(grade-1)*200,48)}document.querySelector('#time').textContent=t+' ms';document.querySelector('#seek').value=t}
let time=0,playing=true,last=performance.now();const play=document.querySelector('#play');play.onclick=()=>{playing=!playing;play.textContent=playing?'暂停':'播放'};document.querySelector('#replay').onclick=()=>{time=0;playing=true;play.textContent='暂停';render(time)};document.querySelector('#seek').oninput=e=>{time=+e.target.value;playing=false;play.textContent='播放';render(time)};document.querySelector('#light').onchange=()=>render(time);function tick(now){if(playing){time+=Math.min(100,now-last);if(time>3600)time=1600;render(time)}last=now;requestAnimationFrame(tick)}render(0);requestAnimationFrame(tick);window.lootR69={render,config};
